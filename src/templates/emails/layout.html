<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .header { background: linear-gradient(135deg, #10b981, #06b6d4); padding: 30px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
    .content { padding: 30px; color: #333333; line-height: 1.6; }
    .button { display: inline-block; padding: 14px 28px; background: #10b981; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 16px 0; }
    .footer { padding: 20px; text-align: center; color: #888888; font-size: 12px; background: #f9f9f9; }
    .highlight { background: #f0fdf4; border-left: 4px solid #10b981; padding: 12px 16px; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Quotixos B2B</h1>
    </div>
    <div class="content">
      {{{body}}}
    </div>
    <div class="footer">
      © 2026 Quotixos. Todos los derechos reservados.<br>
      <a href="https://quotixos.com" style="color:#10b981;">quotixos.com</a>
    </div>
  </div>
</body>
</html>
